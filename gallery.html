<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statue Gallery</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f1ea; overflow: hidden; font: 13px system-ui, sans-serif; color: #6b6660; }
    canvas { display: block; }
    #bar { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    #bar h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; margin: 0; }
    #bar label { cursor: pointer; user-select: none; }
    #labels div { position: fixed; transform: translate(-50%, 0); white-space: nowrap; pointer-events: none; font-size: 11px; letter-spacing: 0.06em; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="bar">
    <h1>STATUE GALLERY</h1>
    <label><input type="checkbox" id="variants"> pose variations (three each)</label>
    <label><input type="checkbox" id="turn" checked> turn</label>
    <span>drag to orbit, scroll to zoom</span>
  </div>
  <div id="labels"></div>
  <script type="module" src="./src/gallery.js"></script>
</body>
</html>
